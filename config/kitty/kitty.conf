# =============================================================================
# Miarch · kitty
# Los colores salen del wallpaper (miarch-colors → miarch-colors.conf).
# Cambia el fondo con Super+W y la terminal cambia con él.
# =============================================================================

# ── Tipografía ──
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11
disable_ligatures never
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font

# ── Cursor (sin animaciones: ni parpadeo ni estela) ──
cursor_shape          block
cursor_blink_interval 0
cursor_trail          0

# ── Ventana ──
background_opacity          0.80
dynamic_background_opacity  yes
window_padding_width        16 20
remember_window_size        no
initial_window_width        110c
initial_window_height       32c
confirm_os_window_close     0
hide_window_decorations     yes

# ── Scroll y selección ──
scrollback_lines            20000
scrollbar                   never
copy_on_select              clipboard
strip_trailing_spaces       smart
mouse_hide_wait             3.0
url_style                   curly
open_url_with               default
detect_urls                 yes

# ── Sonido y shell ──
enable_audio_bell           no
shell                       zsh
shell_integration           enabled no-cursor

# ── Rendimiento ──
repaint_delay               8
input_delay                 1
sync_to_monitor             yes

# ── Atajos extra ──
map ctrl+shift+equal        change_font_size all +1.0
map ctrl+shift+minus        change_font_size all -1.0
map ctrl+shift+backspace    change_font_size all 0
map ctrl+shift+f5           load_config_file
map ctrl+shift+o            opacity_up
map ctrl+shift+i            opacity_down

# ── Colores (los genera miarch-colors; si no existe, usa estos) ──
foreground            #cfc6b4
background            #12141a
selection_foreground  #12141a
selection_background  #b97b62
cursor                #b97b62
url_color             #7d8aa0
include miarch-colors.conf
# tus cambios personales (los conserva cualquier actualización); si el archivo no existe, no pasa nada.
# (se usa include y no globinclude: kitty no admite rutas absolutas en globinclude)
include ~/.config/miarch/personal/kitty.conf
